<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Mentale : Utilisation du Banc de Scie</title>
    <style>
        /* CSS pour que la carte mentale remplisse toute la page */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Empêche les barres de défilement */
        }
        /* Style du conteneur SVG pour la carte mentale */
        #mindmap-container {
            width: 100%;
            height: 100%;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <svg id="mindmap-container"></svg>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17"></script>

    <script>
        // On récupère les classes 'Transformer' et 'Markmap' de l'objet global window.markmap
        const { Transformer, Markmap } = window.markmap;

        // On instancie le transformateur
        const transformer = new Transformer();

        // Le conteneur SVG où la carte sera rendue
        const svgEl = document.querySelector('#mindmap-container');

        // Les données transposées du MindMap "Utilisation du Banc de Scie"
        const markdownData = `
# Utilisation du Banc de Scie

## Préparation et Sécurité
- Débrancher/Cadenasser avant réglage
- Portez protections (yeux, oreilles)
- Vérifier l'équerrage (lumière/règle)
- Ajuster hauteur (1/4 po au-dessus)
- Couteau diviseur obligatoire
- Pas de gants pendant la coupe

## Techniques de Coupe
- **Refendre (sens du grain)**
    - Utiliser guide parallèle
    - Poussoirs obligatoires
    - Appui solide (2 points)
- **Tronçonner (perpendiculaire)**
    - Utiliser chariot à tronçonner
    - Bras bloqués/balancement du corps
    - Planche martyr possible
- **Grands Panneaux**
    - Toujours à la règle latérale
    - Chariots ou aide pour soutien
    - Pousser vers le guide

## Composants et Outils
- **Lames**
    - Combinée, Refendre ou Finition
    - Aiguisage professionnel
    - Nettoyage au dégraisseur
- Poussoirs (Lapin ou serpent)
- Indicateurs pour biseaux
- Saw Stop (protection textile)

## Entretien et Routine
- **Quotidien**
    - Aspirer la poussière
    - Vider sac de sciure (combustion)
    - Descendre la lame
- **Périodique**
    - Graissage mécanique
    - Ajuster ruban
    - Nettoyer table

## Ressources et Pièces
- Machinerie P.L.B.S. (Hochelaga)
- Pierre Berger (Rive-Sud)
- Normand (Laval)
- King / Dewalt / Steel City

## Contre-indications
- Bois tordu/gauche (non dégauchi)
- Pièces courtes (< 10 pouces)
- Bois non séché (pin < 6 mois)
- Métaux conducteurs (si Saw Stop)
`;

    // Étape 1 : Transformer le texte Markdown en un objet de données (root)
    const { root } = transformer.transform(markdownData);

    // Étape 2 : Créer la carte mentale interactive
    // initialExpandLevel: 2 permet de voir les catégories principales au chargement
    Markmap.create(svgEl, {
        initialExpandLevel: 2
    }, root);

</script>
</body>
</html>
