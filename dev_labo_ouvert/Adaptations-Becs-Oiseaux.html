<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptations des Becs d'Oiseaux - Jeu Éducatif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2em;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .food-section {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .food-section h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .flower-display {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .flower-svg {
            width: 150px;
            height: 150px;
        }

        .food-description {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .birds-section {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 25px;
            border-radius: 15px;
            color: white;
        }

        .birds-section h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5em;
        }

        .bird-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .bird-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            color: #333;
        }

        .bird-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .bird-card.selected {
            border-color: #27ae60;
            background: #d5f4e6;
        }

        .bird-card.wrong {
            border-color: #e74c3c;
            background: #fadbd8;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .beak-preview {
            width: 80px;
            height: 60px;
            margin: 10px auto;
        }

        .bird-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .bird-latin {
            font-style: italic;
            color: #7f8c8d;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .beak-type {
            font-size: 0.85em;
            color: #555;
        }

        .feedback-section {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
            min-height: 150px;
        }

        .feedback-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-section.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .feedback-section h3 {
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .feedback-text {
            line-height: 1.8;
            font-size: 1.05em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-validate {
            background: #27ae60;
            color: white;
        }

        .btn-validate:hover {
            background: #229954;
            transform: scale(1.05);
        }

        .btn-validate:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: scale(1);
        }

        .btn-next {
            background: #3498db;
            color: white;
        }

        .btn-next:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .btn-screenshot {
            background: #9b59b6;
            color: white;
        }

        .btn-screenshot:hover {
            background: #8e44ad;
            transform: scale(1.05);
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #2c3e50;
            font-weight: bold;
        }

        .screenshot-preview {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .screenshot-content {
            text-align: center;
        }

        .screenshot-bird-head {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        @media (max-width: 768px) {
            .game-area {
                grid-template-columns: 1fr;
            }
            
            .bird-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>

                            <ellipse cx="30" cy="22" rx="18" ry="15" fill="#2c2c2c"/>

            },
            {
                food: {
                    name: "Vers de terre dans le sol",
                    latinName: "Lumbricus terrestris",
                    type: "Proies enfouies dans le sol",
                    description: "Vers de terre vivant dans les premiers centimètres du sol humide, nécessitant une détection tactile.",
                    svg: `<svg class="flower-svg" viewBox="0 0 150 150">
                        <g>
                            <!-- Sol -->
                            <rect x="20" y="80" width="110" height="60" fill="#8B4513"/>

                            <path d="M 30 80 L 28 65 L 32 80" fill="#4a7c2e"/>

                            <!-- Ver de terre visible partiellement -->
                            <path d="M 75 90 Q 80 95 75 100 Q 70 105 75 110 Q 78 113 75 115" 
                                  stroke="#CD5C5C" stroke-width="4" fill="none" stroke-linecap="round"/>
                            <circle cx="75" cy="90" r="2" fill="#8B4545"/>
                        </g>
                    </svg>`
                },
                birds: [
                    {
                        name: "Bécasse d'Amérique",
                        latinName: "Scolopax minor",
                        beakType: "Long et flexible",
                        correct: true,
                        explanation: "La Bécasse d'Amérique possède un bec remarquablement long (6-7 cm) et flexible, avec une pointe sensible riche en corpuscules de Herbst permettant la détection tactile des proies sous terre. Son bec peut s'ouvrir à l'extrémité grâce à des muscles spécialisés, lui permettant de saisir les vers sans retirer le bec du sol (technique appelée rhynchokinésie). Cette adaptation neuromusculaire unique illustre la sélection pour l'efficacité de chasse : les bécasses peuvent localiser et capturer des vers dans l'obscurité totale par détection des vibrations. Ses yeux sont également placés très en arrière du crâne, offrant une vision à 360° pour détecter les prédateurs pendant qu'elle se nourrit.",
                        beakSvg: `<svg class="beak-preview" viewBox="0 0 80 60">
                            <ellipse cx="30" cy="30" rx="20" ry="18" fill="#8B7355"/>

                            <path d="M 45 30 L 75 29 Q 76 30 75 31 L 45 30 Z" fill="#D2691E"/>
                        </svg>`,
                        headSvg: `<svg class="screenshot-bird-head" viewBox="0 0 120 120">
                            <ellipse cx="60" cy="60" rx="40" ry="36" fill="#8B7355"/>
                            <circle cx="55" cy="50" r="8" fill="black"/>

                            <path d="M 90 60 L 115 58 Q 117 60 115 62 L 90 60 Z" fill="#D2691E"/>
                        </svg>`
                    },
                    {
                        name: "Cardinal rouge",
                        latinName: "Cardinalis cardinalis",
                        beakType: "Conique et robuste",
                        correct: false,
                        beakSvg: `<svg class="beak-preview" viewBox="0 0 80 60">
                            <ellipse cx="30" cy="30" rx="20" ry="22" fill="#dc143c"/>
                            <circle cx="28" cy="25" r="3" fill="black"/>
                            <circle cx="28" cy="24" r="1" fill="white"/>
                            <path d="M 45 28 L 58 30 L 45 32 Z" fill="#ff6347"/>
                            <path d="M 20 18 L 30 12 L 28 20 Z" fill="#dc143c"/>
                        </svg>`
                    },
                    {
                        name: "Pic mineur",
                        latinName: "Dryobates pubescens",
                        beakType: "Droit en forme de ciseau",
                        correct: false,
                        beakSvg: `<svg class="beak-preview" viewBox="0 0 80 60">
                            <ellipse cx="30" cy="30" rx="18" ry="20" fill="#2c2c2c"/>
                            <ellipse cx="35" cy="35" rx="12" ry="10" fill="white"/>

                            <path d="M 45 29 L 70 28 L 70 32 L 45 31 Z" fill="#4a4a4a"/>
                            <rect x="20" y="15" width="8" height="4" fill="#dc143c"/>
                        </svg>`
                    },
                    {
                        name: "Mésange à tête noire",
                        latinName: "Poecile atricapillus",
                        beakType: "Court et pointu",
                        correct: false,
                        beakSvg: `<svg class="beak-preview" viewBox="0 0 80 60">
                            <ellipse cx="30" cy="30" rx="20" ry="22" fill="#d3d3d3"/>
                            <ellipse cx="30" cy="22" rx="18" ry="15" fill="#2c2c2c"/>
                            <circle cx="28" cy="20" r="3" fill="white"/>
                            <circle cx="28" cy="20" r="1.5" fill="black"/>
                            <ellipse cx="30" cy="40" rx="15" ry="12" fill="white"/>
                            <path d="M 45 30 L 55 30 L 50 32 Z" fill="#4a4a4a"/>
                        </svg>`
                    }
                ]
            }
        ];

        let currentLevel = 0;
        let selectedBirdIndex = null;

        function initGame() {
            document.getElementById('totalLevels').textContent = gameData.length;
            loadLevel();
        }

        function loadLevel() {
            const level = gameData[currentLevel];
            selectedBirdIndex = null;
            
            // Mise à jour du numéro de niveau
            document.getElementById('levelNumber').textContent = currentLevel + 1;
            
            // Affichage de la nourriture
            document.getElementById('flowerDisplay').innerHTML = level.food.svg;
            document.getElementById('foodDescription').innerHTML = `
                <strong>${level.food.name}</strong><br>
                <em>${level.food.latinName}</em><br>
                ${level.food.description}
            `;
            
            // Affichage des oiseaux
            const birdGrid = document.getElementById('birdGrid');
            birdGrid.innerHTML = '';
            
            level.birds.forEach((bird, index) => {
                const card = document.createElement('div');
                card.className = 'bird-card';
                card.innerHTML = `
                    ${bird.beakSvg}
                    <div class="bird-name">${bird.name}</div>
                    <div class="bird-latin">${bird.latinName}</div>
                    <div class="beak-type">Bec : ${bird.beakType}</div>
                `;
                card.onclick = () => selectBird(index);
                birdGrid.appendChild(card);
            });
            
            // Réinitialisation du feedback
            document.getElementById('feedbackSection').classList.remove('show', 'success');
            document.getElementById('validateBtn').disabled = true;
        }

        function selectBird(index) {
            // Retirer la sélection précédente
            document.querySelectorAll('.bird-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Sélectionner le nouvel oiseau
            selectedBirdIndex = index;
            document.querySelectorAll('.bird-card')[index].classList.add('selected');
            document.getElementById('validateBtn').disabled = false;
        }

        function validateAnswer() {
            const level = gameData[currentLevel];
            const selectedBird = level.birds[selectedBirdIndex];
            const feedbackSection = document.getElementById('feedbackSection');
            
            if (selectedBird.correct) {
                feedbackSection.classList.add('success');
                document.getElementById('feedbackTitle').textContent = '✅ Excellent ! Bonne réponse !';
                document.getElementById('feedbackText').innerHTML = `
                    <strong>Coévolution et pression de sélection :</strong><br><br>
                    ${selectedBird.explanation}
                `;
            } else {
                // Mauvaise réponse
                document.querySelectorAll('.bird-card')[selectedBirdIndex].classList.add('wrong');
                setTimeout(() => {
                    document.querySelectorAll('.bird-card')[selectedBirdIndex].classList.remove('wrong', 'selected');
                    selectedBirdIndex = null;
                    document.getElementById('validateBtn').disabled = true;
                }, 500);
                return;
            }
            
            feedbackSection.classList.add('show');
            document.getElementById('validateBtn').style.display = 'none';
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= gameData.length) {
                showCompletion();
            } else {
                document.getElementById('validateBtn').style.display = 'block';
                loadLevel();
            }
        }

        function showCompletion() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <h1>🎉 Félicitations !</h1>
                <div style="text-align: center; padding: 50px;">
                    <h2 style="color: #27ae60; margin-bottom: 30px;">Vous avez complété tous les niveaux !</h2>
                    <p style="font-size: 1.2em; line-height: 1.8; max-width: 800px; margin: 0 auto;">
                        Vous avez découvert comment la <strong>coévolution</strong> et la <strong>pression de sélection réciproque</strong> 
                        façonnent les adaptations morphologiques des oiseaux et de leur environnement. 
                        Chaque bec raconte l'histoire d'une relation évolutive unique entre une espèce et sa source de nourriture.
                    </p>
                    <button class="btn-next" onclick="location.reload()" style="margin-top: 30px;">
                        🔄 Recommencer le jeu
                    </button>
                </div>
            `;
        }

        function captureScreenshot() {
            const level = gameData[currentLevel];
            const correctBird = level.birds.find(b => b.correct);
            
            // Créer une nouvelle section pour l'aperçu de capture
            const screenshotDiv = document.createElement('div');
            screenshotDiv.className = 'screenshot-preview';
            screenshotDiv.innerHTML = `
                <div class="screenshot-content">
                    <h3 style="margin-bottom: 20px; color: #2c3e50;">📸 Capture d'écran prête</h3>
                    ${correctBird.headSvg}
                    <div style="margin: 20px 0;">
                        <div style="display: inline-block; vertical-align: middle; margin: 0 20px;">
                            ${level.food.svg}
                        </div>
                    </div>
                    <div style="text-align: left; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8f9fa; border-radius: 10px;">
                        <h4 style="color: #2c3e50; margin-bottom: 10px;">${correctBird.name}</h4>
                        <p style="font-style: italic; color: #7f8c8d; margin-bottom: 15px;">${correctBird.latinName}</p>
                        <p style="line-height: 1.6; color: #2c3e50;">${correctBird.explanation}</p>
                    </div>
                    <p style="margin-top: 20px; color: #7f8c8d; font-size: 0.9em;">
                        Utilisez l'outil de capture d'écran de votre appareil pour sauvegarder cette explication.
                    </p>
                </div>
            `;
            
            // Remplacer temporairement le contenu
            const originalContent = document.querySelector('.container').innerHTML;
            document.querySelector('.container').innerHTML = '';
            document.querySelector('.container').appendChild(screenshotDiv);
            
            // Ajouter un bouton pour revenir
            const backButton = document.createElement('button');
            backButton.className = 'btn-next';
            backButton.textContent = '← Retour au jeu';
            backButton.style.marginTop = '20px';
            backButton.onclick = () => {
                document.querySelector('.container').innerHTML = originalContent;
                reinitializeEventListeners();
            };
            screenshotDiv.querySelector('.screenshot-content').appendChild(backButton);
        }

        function reinitializeEventListeners() {
            document.getElementById('validateBtn').onclick = validateAnswer;
            document.getElementById('nextBtn').onclick = nextLevel;
            document.getElementById('screenshotBtn').onclick = captureScreenshot;
        }

        // Initialisation
        document.getElementById('validateBtn').onclick = validateAnswer;
        document.getElementById('nextBtn').onclick = nextLevel;
        document.getElementById('screenshotBtn').onclick = captureScreenshot;
        
        initGame();
    </script>
</body>
