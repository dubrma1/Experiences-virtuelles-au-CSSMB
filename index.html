document.addEventListener('DOMContentLoaded', function() {
    try {
        // Initialisation des éléments
        const appsContainer = document.getElementById('apps-container');
        const universFilter = document.getElementById('univers-filter');
        const niveauFilter = document.getElementById('niveau-filter');
        const approcheFilter = document.getElementById('approche-filter');

        // Fonction d'affichage
        function renderApps() {
            appsContainer.innerHTML = '';
            
            const filteredApps = apps.filter(app => {
                return (universFilter.value === 'all' || app.univers === universFilter.value) &&
                       (niveauFilter.value === 'all' || app.niveau === niveauFilter.value) &&
                       (approcheFilter.value === 'all' || app.approche === approcheFilter.value);
            });

            // Message si aucun résultat
            if (filteredApps.length === 0) {
                appsContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: #666;">Aucune application ne correspond à ces critères pour le moment. 🧪</div>';
                return;
            }

            filteredApps.forEach(app => {
                const appElement = document.createElement('div');
                appElement.classList.add('app');
                const baseUrl = "https://laboouvert-52877995.web.app/";

                appElement.innerHTML = `
                    <a href="${baseUrl}${app.url}" target="_blank">
                        <div class="app-image">${app.emoji}</div>
                        <div class="app-name">${app.name}</div>
                    </a>
                    <div class="app-footer">
                        <div class="tags">
                            <span>${getLabel(app.univers)}</span>
                            <span>${app.niveau.toUpperCase()}</span>
                            <span>${app.approche === 'exp' ? 'Exp.' : (app.approche === 'tec' ? 'Tech.' : 'Jeu')}</span>
                        </div>
                        <div class="likes">
                            <button class="like-btn" data-app-id="${app.id}">❤️</button>
                            <span id="like-count-${app.id}" class="like-count">0</span>
                        </div>
                    </div>
                `;
                appsContainer.appendChild(appElement);
            });
            // L'ancien code de chargement des likes a été retiré d'ici pour éviter les conflits.
        }

        // Helper pour afficher un nom joli au lieu du code
        function getLabel(code) {
            const labels = {
                'astro': 'Astro', 'bio': 'Bio', 'chi': 'Chimie', 
                'genie': 'Ing.', 'e&m': 'Élec.', 'phy': 'Physique', 'terre': 'Terre'
            };
            return labels[code] || code;
        }

        // --- CES LIGNES MANQUAIENT ---
        // Écouteurs d'événements pour faire fonctionner les menus déroulants
        universFilter.addEventListener('change', renderApps);
        niveauFilter.addEventListener('change', renderApps);
        approcheFilter.addEventListener('change', renderApps);

        // Premier affichage au chargement de la page
        renderApps();
        // -----------------------------

        // Connexion Firebase avec Authentification Anonyme (Ton nouveau code)
        if(typeof firebase !== 'undefined') {
            const db = firebase.database();
            
            // Connexion silencieuse
            firebase.auth().signInAnonymously().catch(error => {
                console.error("Erreur d'authentification :", error);
            });

            // On attend que l'utilisateur soit connecté (même anonymement)
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    const uid = user.uid;
                    const itemsRef = db.ref('items');

                    // Gestion des clics sur "Like"
                    appsContainer.addEventListener('click', e => {
                        if (e.target.matches('.like-btn')) {
                            const appId = e.target.dataset.appId;
                            
                            // 1. On incrémente le compteur officiel dans 'items'
                            db.ref(`items/${appId}/likeCount`).transaction(curr => (curr || 0) + 1)
                            .then(() => {
                                // 2. On enregistre que cet utilisateur précis a voté dans 'likes'
                                db.ref(`likes/${appId}/${uid}`).set(true);
                            });
                        }
                    });

                    // Affichage en temps réel (on écoute 'items' au lieu de 'likes')
                    itemsRef.on('value', (snapshot) => {
                        const allItems = snapshot.val() || {};
                        // On s'assure de parcourir tes applications définies
                        apps.forEach(app => {
                            const el = document.getElementById(`like-count-${app.id}`);
                            if (el) {
                                // On va chercher le likeCount, ou 0 s'il n'existe pas encore
                                const count = allItems[app.id]?.likeCount || 0;
                                el.textContent = count;
                            }
                        });
                    });
                }
            });
        }

    } catch (e) {
        console.error("Erreur AppLab:", e);
    }
});
